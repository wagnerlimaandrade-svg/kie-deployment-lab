apiVersion: apps/v1
kind: Deployment
metadata:
  name: kie-runtime
  namespace: kie-dev
  labels:
    app.kubernetes.io/name: kie-runtime
    app.kubernetes.io/part-of: kie-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kie-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kie-runtime
        app.kubernetes.io/part-of: kie-local
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kie-runtime
          image: kie-runtime-local:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
